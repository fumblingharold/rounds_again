[package]
name = "rounds_again"
version = "0.1.0"
edition = "2024"

[dependencies]
cosmic-text = "0.19.0"
bevy = { version = "0.18.1" , default-features = true, features = [
    "dynamic_linking",
    "debug", "wayland"]}
bevy_rapier2d = {  version = "0.34.0",
    features = ["debug-render-2d", "simd-stable"]
}
parry2d = "0.26.1"
bevy_mod_debugdump = "0.15.0"

[profile.release]
codegen-units = 1

[profile.dev.package."*"]
opt-level = 3